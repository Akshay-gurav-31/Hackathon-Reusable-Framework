  results_announced: "2026-11-05"

tracks:
  - name: "Leucine Estimation & Accuracy"
    description: "Improve the accuracy of leucine-estimator models and algorithms scored against public benchmarks."
  - name: "Living Low-Protein Food Database"
    description: "Expand cited, schema'd food lists and clinician-verified nutritional data for MSUD diets."
  - name: "Hardware & Smart Scale Integrations"
    description: "Connect smart kitchen scales directly to mobile devices and web apps for real-time protein tracking."
  - name: "Caregiver Tools & Accessibility"
    description: "Build low-friction apps and alerts that help caregivers log meals and catch dietary errors fast, especially during high-stress moments."

