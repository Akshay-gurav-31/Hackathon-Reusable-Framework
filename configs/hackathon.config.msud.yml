hackathon:
  name: "MSUD Bridge Science Hackathon 2026"
  # Logo Image: Use local path like "./assets/logo.png" or online image URL
  logo: "https://images.unsplash.com/photo-1532094349884-543bc11b234d?w=400&h=400&fit=crop&q=80"
  tagline: "Building Open Science & Metabolic Tools for the MSUD Community"
  description: |
    A virtual science hackathon for the Maple Syrup Urine Disease (MSUD) community — a rare, life-threatening
    metabolic disorder that requires lifelong, precise dietary management. We bring together developers,
    researchers, dietitians, clinicians, and MSUD families to improve open leucine-estimation tools, living
    low-protein food databases, and connected kitchen scale integrations — all built in the open, for the
    community, with the community.
  disorder: "Maple Syrup Urine Disease (MSUD)"
  rare_disease_context:
    prevalence: "Approximately 1 in 185,000 live births globally; higher (~1 in 380) in certain founder populations such as the Old Order Mennonite community."
    why_it_matters: |
      MSUD is a rare autosomal recessive metabolic disorder caused by a deficiency in the branched-chain
      alpha-ketoacid dehydrogenase complex, leading to toxic buildup of leucine, isoleucine, and valine.
      Untreated or poorly managed MSUD can cause metabolic crises, irreversible neurological damage, and
      death. Because it is rare, commercial investment in digital tools for MSUD families is minimal —
      which is exactly the gap this hackathon exists to close.
  community:
    name: "MSUD Bridge"
    url: "https://msudbridge.org"
    mission: "A patient-and-family-led nonprofit building open-source tools, education, and community support for people living with MSUD worldwide."

problem_statement:
  title: "The MSUD Dietary & Accuracy Challenge"
  description: |
    People living with Maple Syrup Urine Disease (MSUD) must strictly restrict leucine intake to prevent
    neurological complications and metabolic crises. Current tools for tracking low-protein foods are
    fragmented, lack clinician validation, or require expensive proprietary hardware — putting the burden
    of manual gram-by-gram calculation on caregivers, often multiple times a day, for a lifetime.
  objectives:
    - "Build open-source leucine estimation algorithms benchmarked against validated clinical datasets."
    - "Create living, schema-structured low-protein food databases with verified nutritional data."
    - "Develop Web Bluetooth scale drivers to automate real-time protein weighing for MSUD families."
    - "Design accessible mobile/web interfaces usable by caregivers under stress (e.g. during a metabolic crisis)."
    - "Publish clear documentation so clinicians and dietitians can adopt and extend these tools post-hackathon."

rules:
  - title: "Open Source Licensing"
    description: "All project code submitted must be released under an OSI-approved open source license (MIT, Apache 2.0, or GPL)."
  - title: "Original Work"
    description: "Teams may use open libraries, but all core hackathon code and submission progress must be created during the event window (Oct 15–30, 2026)."
  - title: "Team & Solo Structure"
    description: "Participate solo or in teams of up to 4 members. Every team member must register individually via the registration form."
  - title: "Community Code of Conduct"
    description: "Maintain a respectful, collaborative, and inclusive environment for dietitians, patients, and developers alike. Zero tolerance for harassment or discrimination."
  - title: "Data Privacy & Safety"
    description: "No real patient health data may be used. Only synthetic, anonymized, or publicly published clinical/benchmark datasets are permitted."
  - title: "Medical Disclaimer"
    description: "All tools built are decision-support aids only and must clearly state they do not replace professional medical or dietetic advice."

dates:
  registration_open: "2026-09-01"
  registration_close: "2026-10-01"
  hackathon_start: "2026-10-15"
  hackathon_end: "2026-10-30"
