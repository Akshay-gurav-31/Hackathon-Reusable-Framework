faq:
  enabled: true
  items:
    - question: "Who can participate in this hackathon?"
      answer: "Anyone! Developers, researchers, dietitians, MSUD patients, and family members are all welcome to join and build."
    - question: "How are projects judged?"
      answer: "Projects are evaluated on public benchmark accuracy scores, code quality, open source sustainability, and real-world impact for MSUD families."
    - question: "Is there any entry fee?"
      answer: "No, participation is completely free for everyone."
    - question: "Can I participate solo or do I need a team?"
      answer: "Both are allowed! You can build individually or form a team of up to 4 members."
    - question: "How do I submit my project?"
      answer: "All projects must be submitted through the official submission form linked on the hackathon page before the deadline."
    - question: "Will there be mentorship support during the hackathon?"
      answer: "Yes, experienced mentors in metabolic nutrition, dietetics, and hardware integration will be available throughout the event to guide participants."
    - question: "What happens if I miss the submission deadline?"
      answer: "Late submissions will not be considered for judging or prizes, so please ensure your project is submitted before the deadline."
    - question: "Do I need prior knowledge of MSUD or metabolic disorders to participate?"
      answer: "No prior medical knowledge is required. Clinician mentors and a dedicated workshop will bring every team up to speed on the essential dietary constraints."
    - question: "What datasets can we use for leucine estimation?"
      answer: "Only publicly available or synthetic clinical/nutritional datasets provided or approved by the organizers may be used — no real, identifiable patient data is permitted."
    - question: "Will there be travel or accommodation support?"
      answer: "This is a fully virtual hackathon, so no travel is required. All workshops, check-ins, and the closing ceremony are streamed online."

