<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #5d667a;
      --accent: #2563eb;
      --border: #e5e7eb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, rgba(37, 99, 235, 0.08), transparent 30%),
        var(--bg);
      color: var(--text);
      padding: 24px;
    }

    .card {
      width: min(100%, 520px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.08);
    }

    .badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: #eff6ff;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 18px 0 12px;
      font-size: 34px;
      line-height: 1.1;
    }

    p {
      margin: 0 0 16px;
      font-size: 16px;
      line-height: 1.6;
      color: var(--muted);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      border: 1px solid transparent;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    a:hover {
      transform: translateY(-1px);
    }

    .primary {
      background: var(--accent);
      color: white;
      box-shadow: 0 12px 24px rgba(37, 99, 235, 0.2);
    }

    .secondary {
      background: #fff;
      color: var(--text);
      border-color: var(--border);
    }

    .note {
      margin-top: 20px;
      font-size: 13px;
      color: #768096;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">404</div>
    <h1>Page not found</h1>
    <p>This link does not exist on this site. If you typed the address manually, please check it once again.</p>
    <div class="actions">
      <a class="primary" id="homeLink" href="./">Go to home</a>
      <a class="secondary" id="setupLink" href="./setup/">Open setup</a>
    </div>
    <p class="note">If the site was just deployed, wait a minute and refresh once more.</p>
  </main>
  <script>
    (function () {
      var parts = window.location.pathname.split('/').filter(Boolean);
      var base = parts.length ? '/' + parts[0] + '/' : '/';
      document.getElementById('homeLink').setAttribute('href', base);
      document.getElementById('setupLink').setAttribute('href', base + 'setup/');
    })();
  </script>
</body>
</html>
