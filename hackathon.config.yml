problem_statement:
  title: "The PKU Phenylalanine & Diet Accuracy Challenge"
  description: |
    People living with Phenylketonuria (PKU) must strictly restrict phenylalanine intake to prevent neurological complications. Current tools for tracking phenylalanine and protein levels are fragmented, lack clinician validation, or require manually searching multiple nutritional databases.
  objectives:
    - "Build open-source phenylalanine estimation algorithms benchmarked against validated clinical datasets."
    - "Create living, schema-structured low-protein food databases with verified nutritional data."
    - "Develop smart kitchen scale integrations to automate real-time protein weighing for PKU families."

