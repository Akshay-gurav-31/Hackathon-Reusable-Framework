problem_statement:
  title: "The MSUD Dietary & Accuracy Challenge"
  description: |
    People living with Maple Syrup Urine Disease (MSUD) must strictly restrict leucine intake to prevent neurological complications and metabolic crises. Current tools for tracking low-protein foods are fragmented, lack clinician validation, or require expensive proprietary hardware.
  objectives:
    - "Build open-source leucine estimation algorithms benchmarked against validated clinical datasets."
    - "Create living, schema-structured low-protein food databases with verified nutritional data."
    - "Develop Web Bluetooth scale drivers to automate real-time protein weighing for MSUD families."

rules:
  - title: "Open Source Licensing"
    description: "All project code submitted must be released under an OSI-approved open source license (MIT, Apache 2.0, or GPL)."
  - title: "Original Work"
    description: "Teams may use open libraries, but all core hackathon code and submission progress must be created during the event."
  - title: "Team & Solo Structure"
    description: "Participate solo or in teams of up to 4 members. Every team member must register individually."
  - title: "Community Code of Conduct"
    description: "Maintain a respectful, collaborative, and inclusive environment for dietitians, patients, and developers alike."

